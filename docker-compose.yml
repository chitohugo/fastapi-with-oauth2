services:
  db:
    image: postgres:16-alpine
    container_name: db-character
    env_file:
      - .env
    environment:
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5434}:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    networks:
      - character
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  character:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: api-character
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      UVICORN_RELOAD: "true"
      SQLALCHEMY_ECHO: "false"
    volumes:
      - .:/app
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    networks:
      - character
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  mcp-http:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mcp-character-http
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SQLALCHEMY_ECHO: "false"
    command: python -m app.mcp.http_server
    ports:
      - "${MCP_HTTP_PORT:-8001}:8000"
    networks:
      - character
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  character-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: api-character-prod
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      UVICORN_RELOAD: "false"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      SQLALCHEMY_ECHO: "false"
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    networks:
      - character
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

networks:
  character:
    driver: bridge

volumes:
  psql:
    driver: local
