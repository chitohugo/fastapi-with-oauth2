name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/change-me-use-a-long-random-string/ci-secret-key-for-tests/' .env

      - name: Build and start services
        run: |
          docker compose build character
          docker compose up -d db character

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Pytest
        run: docker compose exec -T character pytest -vv
